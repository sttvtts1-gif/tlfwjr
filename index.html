<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그랜드썬 실적 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#fcfcfb; --border:#e3e2de;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#8a8984;
  --s-actual:#2a78d6; --s-prev:#eb6834; --s-target:#c9c8c3; --s-fcst:#86b6ef;
  --good:#008300; --warn:#b26b00; --bad:#c43c3b;
  --accent:#2a78d6; --grid:#ecebe7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --border:#2e2e2b;
    --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c84;
    --s-actual:#3987e5; --s-prev:#d95926; --s-target:#55544f; --s-fcst:#184f95;
    --good:#3fb950; --warn:#e3a33b; --bad:#e66767; --accent:#3987e5; --grid:#2a2a27;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --border:#2e2e2b;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c84;
  --s-actual:#3987e5; --s-prev:#d95926; --s-target:#55544f; --s-fcst:#184f95;
  --good:#3fb950; --warn:#e3a33b; --bad:#e66767; --accent:#3987e5; --grid:#2a2a27;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--text-3)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{font-size:13px;color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:6px}
nav a:hover{background:var(--bg)} nav a.on{background:var(--text-1);color:var(--surface)}
.tools{display:flex;gap:6px}
button.ic{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button.ic:hover{color:var(--text-1)}
main{max-width:1280px;margin:0 auto;padding:16px}
section.slide{min-height:calc(100vh - 70px);padding:24px 0 40px;scroll-margin-top:64px}
.eyebrow{font-size:12px;color:var(--text-3);letter-spacing:.04em}
h2{font-size:26px;margin:4px 0 18px;letter-spacing:-.02em}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--text-2)}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500;color:var(--text-2);margin-left:3px}
.kpi .s{font-size:13px;color:var(--text-2);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.meter{height:6px;background:var(--grid);border-radius:99px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s-actual);border-radius:99px}
.chart{position:relative;height:300px} .chart.tall{height:380px}
.review{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:14px 18px;margin-top:14px}
.review b{font-size:13px;color:var(--text-3);display:block;margin-bottom:6px;font-weight:500}
.review ul{margin:0;padding-left:18px} .review li{margin:4px 0;font-size:14px;line-height:1.55;color:var(--text-1)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--text-2);font-size:12px;background:var(--bg)}
th:first-child,td:first-child{text-align:left}
th.l{text-align:left}
td.l{text-align:left;white-space:normal}
tr.tot td{font-weight:700;border-top:2px solid var(--text-3)}
.tblwrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.note{font-size:12px;color:var(--text-3);margin-top:8px}
.split{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 4px}
.split div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.cover{display:flex;flex-direction:column;justify-content:center}
.cover h1{font-size:44px;margin:6px 0 10px;letter-spacing:-.03em}
.cover p{color:var(--text-2);margin:0 0 28px}
@media print{header{display:none}section.slide{page-break-after:always;min-height:auto}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">GRAND SUN 실적 대시보드<small id="periodLabel"></small></div>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="ic" id="themeBtn" title="라이트/다크">테마</button>
    <button class="ic" id="fsBtn" title="전체화면 (F)">전체화면</button>
  </div>
</div></header>
<main id="main"></main>

const fmt=(n,d=0)=>n==null?"–":Number(n).toLocaleString("ko-KR",{maximumFractionDigits:d,minimumFractionDigits:d});
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const rateCls=r=>r>=100?"good":r>=80?"warn":"bad";
const rateTxt=r=>r>=100?"달성":r>=80?"근접":"미달";
const pill=r=>`<span class="pill ${rateCls(r)}">${rateCls(r)==="good"?"▲":rateCls(r)==="warn"?"●":"▼"} ${fmt(r,2)}% ${rateTxt(r)}</span>`;
const reviewBox=(items,t="리뷰")=>`<div class="review"><b>${t}</b><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
const legend=items=>`<div class="legend">${items.map(([l,c])=>`<span style="--c:var(${c})">${l}</span>`).join("")}</div>`;

     <div class="card"><h3>목표량 대비 달성율 (%)</h3><div class="chart"><canvas id="c_rate"></canvas></div><div class="note">점선 = 100%</div></div>
   </div>${reviewBox(M.review)}`},
 {id:"inflow",nav:"유입",html:()=>{const I=D.inflow,tc=I.cap.직접+I.cap.소개,tn=I.cnt.직접+I.cnt.소개;return `<div class="eyebrow">02</div><h2>${D.period} 분석 (유입)</h2>
   <div class="grid g2">
     <div class="card"><h3>용량 기준 (전체 ${fmt(tc,2)}kW)</h3>${splitBar([["직접",I.cap.직접,"--s-actual"],["소개",I.cap.소개,"--s-prev"]],v=>fmt(v,0)+"kW")}<div class="chart"><canvas id="c_inC"></canvas></div></div>
     <div class="card"><h3>건수 기준 (전체 ${tn}건)</h3>${splitBar([["직접",I.cnt.직접,"--s-actual"],["소개",I.cnt.소개,"--s-prev"]],v=>v+"건")}<div class="chart"><canvas id="c_inN"></canvas></div></div>
   </div>${reviewBox(I.review)}`}},
 {id:"type",nav:"계약타입",html:()=>`<div class="eyebrow">03</div><h2>${D.period} 분석 (계약타입)</h2>
   <div class="grid g2">
     <div class="card"><h3>타입별 용량 (kW)</h3><div class="chart"><canvas id="c_tC"></canvas></div></div>
     <div class="card"><h3>타입별 건수</h3><div class="chart"><canvas id="c_tN"></canvas></div></div>
   </div>${reviewBox(D.types.review)}`},
 {id:"people",nav:"개인별",html:()=>{const P=D.people,all=[...P.rows,P.total];return `<div class="eyebrow">04</div><h2>${D.period} / 누적 실적 (개인별·전체)</h2>
   <div class="grid g2">
     <div class="card"><h3>9월 용량 (kW)</h3><div class="chart"><canvas id="c_pM"></canvas></div></div>
     <div class="card"><h3>26년 누적 용량 (kW)</h3><div class="chart"><canvas id="c_pC"></canvas></div></div>
   </div>
   <div class="card" style="margin-top:14px"><div class="tblwrap"><table><thead><tr><th>담당</th><th>9월 용량(kW)</th><th>9월 건수</th><th>누적 용량(kW)</th><th>누적 건수</th></tr></thead><tbody>
   ${all.map((r,i)=>`<tr class="${i===all.length-1?"tot":""}"><td>${r.name}</td><td>${fmt(r.m,1)}</td><td>${r.mc}</td><td>${fmt(r.cum,1)}</td><td>${r.cc}</td></tr>`).join("")}
   </tbody></table></div></div>${reviewBox(P.review)}`}},
 {id:"quarter",nav:"분기",html:()=>{const Q=D.quarter;return `<div class="eyebrow">05</div><h2>2026년도 ${Q.label} 실적</h2>
   <div class="grid g2">
     <div class="card"><h3>직영 월별 목표 · 실적 (kW)</h3>${legend([["목표","--s-target"],["실적","--s-actual"]])}<div class="chart"><canvas id="c_q"></canvas></div></div>
     <div class="card"><h3>직영 3분기 실적표</h3><div class="tblwrap"><table><thead><tr><th>구분</th><th>목표</th><th>실적</th><th>건수</th><th>달성율</th></tr></thead><tbody>
     ${Q.rows.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.target)}</td><td>${fmt(r.actual)}</td><td>${r.cnt}건</td><td>${pill(r.rate)}</td></tr>`).join("")}
     <tr class="tot"><td>3분기 계</td><td>${fmt(Q.total.target)}</td><td>${fmt(Q.total.actual)}</td><td>${Q.total.cnt}건</td><td>${pill(Q.total.rate)}</td></tr>
     </tbody></table></div><div class="note">단위: kW · 직영(가) 기준 · 목표: 정리base 시트 직영 월별 목표</div></div>
   </div>${reviewBox(Q.review)}`}},
 {id:"trend",nav:"추이·예상",html:()=>{const T=D.trend;return `<div class="eyebrow">06</div><h2>2025·2026년 월별 계약용량 추이 및 예상</h2>
   <div class="grid" style="grid-template-columns:2fr 1fr">
     <div class="card"><h3>월별 계약용량 (kW)</h3>${legend([["2025년 실적","--s-prev"],["2026년 실적","--s-actual"],["2026년 예상 A (1~9월 월평균)","--s-fcst"]])}<div class="chart tall"><canvas id="c_tr"></canvas></div></div>
     <div class="card"><h3>요약 (kW)</h3><table><tbody>${T.summary.map(r=>`<tr><td class="l">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>
   </div>${reviewBox(T.review)}`}},
 {id:"pipe",nav:"10월 파이프라인",html:()=>{const P=D.pipeline,tot=P.possibleSum+P.confirmedSum;return `<div class="eyebrow">07</div><h2>2026년 ${P.month} 계약 가능건 및 확정건</h2>
   <div class="grid g3">
     ${kpi("10월 목표",P.target,"kW","",null)}
     ${kpi("계약 확정건",P.confirmedSum,"kW",`${P.confirmed.length}건`,null)}
     ${kpi("계약 가능건",P.possibleSum,"kW",`${P.possible.length}건`,null)}
   </div>
   <div class="card" style="margin-top:14px"><h3>목표 대비 파이프라인 (kW)</h3>
     ${splitBar([["확정",P.confirmedSum,"--s-actual"],["가능",P.possibleSum,"--s-fcst"]],v=>fmt(v)+"kW")}
     <div class="note">확정+가능 합계 ${fmt(tot)}kW · 10월 목표 ${fmt(P.target)}kW</div></div>
   <div class="grid g2" style="margin-top:14px">
     ${pipeTable("계약 가능건",P.possible,P.possibleSum)}${pipeTable("계약 확정건",P.confirmed,P.confirmedSum)}
   </div>${reviewBox(P.review)}`}},
 {id:"sum",nav:"종합·개선",html:()=>{const S=D.summary;return `<div class="eyebrow">08</div><h2>9월 종합분석 및 개선방안</h2>
   <div class="grid g2">
     ${simpleTable(S.compare)}${simpleTable(S.cum)}
   </div>${reviewBox(S.actions,"개선방안")}`}}
];
function kpi(t,v,u,s,rate,delta,dec=0){return `<div class="card kpi"><h3>${t}</h3><div class="v">${delta?"+":""}${fmt(v,dec)}<small>${u}</small></div>
  <div class="s">${s}</div>${rate!=null?`<div style="margin-top:8px">${pill(rate)}</div><div class="meter"><i style="width:${Math.min(rate,100)}%"></i></div>`:""}${delta?`<div style="margin-top:8px"><span class="pill good">▲ ${delta}</span></div>`:""}</div>`}
function splitBar(parts,f){const t=parts.reduce((a,p)=>a+p[1],0);return `<div class="split">${parts.map(p=>`<div style="flex:${p[1]};background:var(${p[2]})" title="${p[0]} ${f(p[1])}">${p[1]/t>.12?`${p[0]} ${(p[1]/t*100).toFixed(1)}%`:""}</div>`).join("")}</div>
  <div class="legend">${parts.map(p=>`<span style="--c:var(${p[2]})">${p[0]} ${f(p[1])} (${(p[1]/t*100).toFixed(2)}%)</span>`).join("")}</div>`}
function pipeTable(t,rows,sum){return `<div class="card"><h3>${t}</h3><div class="tblwrap"><table><thead><tr><th>No.</th><th class="l">상호</th><th>용량(kW)</th><th>위치</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="l">${r[0]}</td><td>${fmt(r[1])}</td><td>${r[2]}</td></tr>`).join("")}
  <tr class="tot"><td>합계</td><td></td><td>${fmt(sum)}</td><td></td></tr></tbody></table></div></div>`}
function simpleTable(T){return `<div class="card"><div class="tblwrap"><table><thead><tr>${T.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
  ${T.rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<td>${c}</td>`:`<td class="l">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}

/* render */
document.getElementById("periodLabel").textContent=D.period+" · 직영 기준";
document.getElementById("nav").innerHTML=slides.map(s=>`<a href="#${s.id}" data-id="${s.id}">${s.nav}</a>`).join("");
document.getElementById("main").innerHTML=slides.map(s=>`<section class="slide" id="${s.id}">${s.html()}</section>`).join("");

/* charts */
let charts=[];
function base(extra={}){const g=css("--grid"),t=css("--text-2");return Object.assign({responsive:true,maintainAspectRatio:false,
  interaction:{mode:"index",intersect:false},
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label||c.label}: ${fmt(c.parsed.y,2)}`}}},
  scales:{x:{grid:{display:false},ticks:{color:t,font:{family:"Noto Sans KR"}}},y:{beginAtZero:true,grid:{color:g},border:{display:false},ticks:{color:t,callback:v=>fmt(v)}}}},extra)}
const bar=(label,data,color,o={})=>Object.assign({label,data,backgroundColor:css(color),borderRadius:4,borderSkipped:"bottom",maxBarThickness:46,categoryPercentage:.7,barPercentage:.9},o);
const refLine={id:"ref",afterDraw(ch){const v=(ch.config.options.plugins||{}).refValue;if(v==null)return;const y=ch.scales.y.getPixelForValue(v),c=ch.ctx;c.save();c.strokeStyle=css("--text-3");c.setLineDash([4,4]);c.beginPath();c.moveTo(ch.chartArea.left,y);c.lineTo(ch.chartArea.right,y);c.stroke();c.restore();}};
const valLabels={id:"vl",afterDatasetsDraw(ch){const o=(ch.config.options.plugins||{}).valLabels;if(!o)return;const c=ch.ctx;c.save();c.fillStyle=css("--text-1");c.font="500 12px Noto Sans KR";c.textAlign="center";
  ch.data.datasets.forEach((ds,di)=>{if(o.only!=null&&o.only!==di)return;ch.getDatasetMeta(di).data.forEach((el,i)=>{const v=ds.data[i];if(v==null)return;c.fillText(o.f(v),el.x,el.y-6)})});c.restore();}};
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,Object.assign({plugins:[refLine,valLabels]},cfg)))}
function drawAll(){charts.forEach(c=>c.destroy());charts=[];
  const regs=[{name:"전체",target:M.target,actual:M.actual,prev:M.prevActual,rate:M.rate},...M.regions];
  mk("c_perf",{type:"bar",data:{labels:regs.map(r=>r.name),datasets:[bar("목표",regs.map(r=>r.target),"--s-target"),bar("9월",regs.map(r=>r.actual),"--s-actual"),bar("전월(8월)",regs.map(r=>r.prev),"--s-prev")]},options:base()});
  mk("c_rate",{type:"bar",data:{labels:regs.map(r=>r.name),datasets:[bar("달성율(%)",regs.map(r=>r.rate),"--s-actual",{maxBarThickness:64})]},options:Object.assign(base(),{plugins:{legend:{display:false},refValue:100,valLabels:{f:v=>fmt(v,2)+"%"},tooltip:{callbacks:{label:c=>`달성율: ${fmt(c.parsed.y,2)}%`}}}})});
  const I=D.inflow;
  mk("c_inC",{type:"bar",data:{labels:["전체","직접","소개"],datasets:[bar("용량(kW)",[I.cap.직접+I.cap.소개,I.cap.직접,I.cap.소개],"--s-actual",{backgroundColor:[css("--s-target"),css("--s-actual"),css("--s-prev")],maxBarThickness:64})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>fmt(v,0)}}})});
  mk("c_inN",{type:"bar",data:{labels:["전체","직접","소개"],datasets:[bar("건수",[I.cnt.직접+I.cnt.소개,I.cnt.직접,I.cnt.소개],"--s-actual",{backgroundColor:[css("--s-target"),css("--s-actual"),css("--s-prev")],maxBarThickness:64})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>v+"건"}}})});
  const T=D.types;
  mk("c_tC",{type:"bar",data:{labels:T.labels,datasets:[bar("용량(kW)",T.cap,"--s-actual",{maxBarThickness:64})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>fmt(v,0)}}})});
  mk("c_tN",{type:"bar",data:{labels:T.labels,datasets:[bar("건수",T.cnt,"--s-actual",{maxBarThickness:64})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>v+"건"}}})});
  const P=[...D.people.rows,D.people.total];
  mk("c_pM",{type:"bar",data:{labels:P.map(r=>r.name),datasets:[bar("9월(kW)",P.map(r=>r.m),"--s-actual",{backgroundColor:P.map((r,i)=>css(i===P.length-1?"--s-target":"--s-actual"))})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>fmt(v,0)}}})});
  mk("c_pC",{type:"bar",data:{labels:P.map(r=>r.name),datasets:[bar("누적(kW)",P.map(r=>r.cum),"--s-actual",{backgroundColor:P.map((r,i)=>css(i===P.length-1?"--s-target":"--s-actual"))})]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{f:v=>fmt(v,0)}}})});
  const Q=D.quarter;
  mk("c_q",{type:"bar",data:{labels:Q.rows.map(r=>r.m),datasets:[bar("목표",Q.rows.map(r=>r.target),"--s-target"),bar("실적",Q.rows.map(r=>r.actual),"--s-actual")]},options:Object.assign(base(),{plugins:{legend:{display:false},valLabels:{only:1,f:v=>fmt(v,0)}}})});
  const TR=D.trend,mo=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const fc=TR.y2026.map(v=>v==null?TR.fcstA:null);
  mk("c_tr",{type:"bar",data:{labels:mo,datasets:[bar("2025년 실적",TR.y2025,"--s-prev",{maxBarThickness:22}),bar("2026년 실적",TR.y2026,"--s-actual",{maxBarThickness:22}),bar("2026년 예상 A",fc,"--s-fcst",{maxBarThickness:22,grouped:false,barPercentage:.45})]},options:base()});
}
drawAll();

/* nav highlight, keyboard, theme, fullscreen */
const links=[...document.querySelectorAll("nav a")];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.slide").forEach(s=>io.observe(s));
function cur(){const ys=slides.map(s=>Math.abs(document.getElementById(s.id).getBoundingClientRect().top-64));return ys.indexOf(Math.min(...ys))}
document.addEventListener("keydown",e=>{if(["ArrowRight","PageDown","ArrowDown"].includes(e.key)||e.key===" "){e.preventDefault();go(cur()+1)}
  else if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){e.preventDefault();go(cur()-1)}else if(e.key==="f"||e.key==="F")fs()});
function go(i){i=Math.max(0,Math.min(slides.length-1,i));document.getElementById(slides[i].id).scrollIntoView({behavior:"smooth"})}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
document.getElementById("fsBtn").onclick=fs;
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("gs-theme",r.dataset.theme)}catch(e){}drawAll()};
try{const t=localStorage.getItem("gs-theme");if(t){document.documentElement.dataset.theme=t;drawAll()}}catch(e){}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawAll);
</script>
</body>
</html>
